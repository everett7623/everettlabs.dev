name: Monthly Maintenance

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  sync-snapshot:
    name: Sync GitHub snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync approved GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:github

      - name: Create snapshot pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: refresh GitHub metadata snapshot'
          branch: chore/monthly-github-snapshot
          title: 'chore: monthly GitHub metadata snapshot'
          body: |
            Automated monthly refresh of `src/generated/github-projects.json` and
            `src/generated/github-sync-meta.json` for approved repositories only.

            Editorial MDX and the project whitelist are unchanged. Review the candidate
            discovery artifact from the Discover candidates job before adding projects.
          add-paths: |
            src/generated/github-projects.json
            src/generated/github-sync-meta.json

  discover-candidates:
    name: Discover candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover non-blocked project candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run discover:candidates

      - name: Upload candidate report
        uses: actions/upload-artifact@v7
        with:
          name: project-candidate-report
          path: |
            .codex/reports/project-candidates-latest.md
            .codex/reports/project-candidates-*.md
          if-no-files-found: error
          retention-days: 30

  production-health:
    name: Production health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe external links
        run: npm run validate:links:external
        continue-on-error: true

      - name: Run production Lighthouse audit
        run: npm run audit:lighthouse:production

      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-lighthouse-report
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
